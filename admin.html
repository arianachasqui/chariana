<style>
:root{--black:#0a0a0a;--white:#faf8f4;--gold:#C9A84C;--gold2:#e8c96a;--gold-light:#f9f2df;--cream:#F6EFE7;--cream2:#ede4d8;--crimson:#8B0000;--gray:#6b6b6b;--gray2:#c8c0b4;
--ink:#0a0a0a;--paper:#faf8f4;--ivory:#F6EFE7;--wine:#8B0000;--muted:#6b6b6b;--line:#ede4d8;--r:12px;--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Jost',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--nav:72px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--cream);color:var(--black);overflow-x:hidden;line-height:1.6}

h1,h2,h3{font-family:var(--serif);font-weight:400}img{max-width:100%;display:block}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;color:inherit}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 clamp(18px,4vw,48px)}
.announce{background:var(--black);color:var(--gold);text-align:center;padding:10px 14px;font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:500}
.announce a{color:var(--gold2);margin-left:8px;border-bottom:1px solid rgba(232,201,106,.3);white-space:nowrap}
@media(max-width:600px){.announce{font-size:10px;letter-spacing:2px}}
/* NAV */
.nav{background:rgba(10,10,10,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(201,168,76,.18)}
.nav .wrap{max-width:none;display:flex;align-items:center;gap:16px;height:var(--nav)}
.logo{font:italic 300 28px var(--serif);color:var(--white);letter-spacing:5px;text-transform:uppercase;margin-right:auto}.logo span{color:var(--gold)}
.menu{display:flex;gap:36px;list-style:none;margin-right:12px}

.menu a:hover{color:var(--gold)}.menu a:hover:after{transform:scaleX(1);transform-origin:left}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 36px;border-radius:4px;border:1px solid transparent;font:600 11px var(--sans);letter-spacing:2.5px;text-transform:uppercase;transition:all .2s;background:transparent;white-space:nowrap;min-height:46px}
.btn.fill{background:var(--gold);color:var(--black);font-weight:700}.btn.fill:hover{background:var(--gold2);transform:translateY(-2px)}
.btn.line{border-color:rgba(255,255,255,.25);color:var(--white);font-weight:500}.btn.line:hover{border-color:var(--gold);color:var(--gold)}
.btn.dark{background:var(--black);color:var(--gold)}.btn.dark:hover{background:var(--gold);color:var(--black)}
.nav .btn{padding:9px 20px;min-height:0}
.burger{display:none;flex-direction:column;gap:5px;background:none;border:0;padding:6px}.burger span{display:block;width:24px;height:1.5px;background:var(--white)}
.drawer{position:fixed;inset:0;z-index:200;background:rgba(10,10,10,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;transform:translateX(100%);transition:transform .35s cubic-bezier(.25,.46,.45,.94);visibility:hidden}
.drawer.on{transform:none;visibility:visible}.drawer a{font:300 36px var(--serif);color:var(--white);letter-spacing:2px}.drawer a:hover,.drawer a.g{color:var(--gold)}
.dx{position:absolute;top:22px;right:26px;background:none;border:0;color:rgba(255,255,255,.55);font-size:28px}
@media(max-width:900px){.menu,.nav .btn{display:none}.burger{display:flex}.logo{font-size:24px;letter-spacing:4px}}
/* IDIOMA */

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@keyframes bounce{0%,100%{transform:translateX(-50%)}50%{transform:translateX(-50%) translateY(-8px)}}
.stats{background:var(--black);padding:30px 20px;display:flex;justify-content:center;border-top:1px solid rgba(201,168,76,.12);border-bottom:1px solid rgba(201,168,76,.12)}

.stat b{display:block;font:400 clamp(28px,5vw,36px)/1 var(--serif);color:var(--gold)}.stat span{display:block;font-size:9px;letter-spacing:2.5px;color:rgba(255,255,255,.4);text-transform:uppercase;margin-top:6px;font-weight:500}

/* PRODUCTOS */
.grid{display:grid;gap:clamp(12px,2vw,20px);grid-template-columns:repeat(2,1fr)}@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{display:flex;flex-direction:column;text-align:left;background:var(--white);border:0;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.08);transition:transform .35s cubic-bezier(.25,.46,.45,.94),box-shadow .35s;padding:0;animation:fadeUp .45s ease both}

.card .im{position:relative;aspect-ratio:1/1.05;background:var(--cream);overflow:hidden}.card .im img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.card:hover .im img{transform:scale(1.06)}

/* CATALOGO */
.head{background:var(--black);position:relative;overflow:hidden;text-align:center;padding:clamp(44px,7vw,64px) 20px clamp(34px,5vw,48px)}
.head:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.12) 0%,transparent 70%)}.head>*{position:relative}
.head .tag{letter-spacing:5px;font-weight:500;font-size:10px;margin-bottom:16px}.head h1{font:300 clamp(40px,7vw,72px)/1.05 var(--serif);color:var(--white);letter-spacing:1px}.head h1 em{color:var(--gold);font-style:italic}
.head p{color:rgba(255,255,255,.5);font-size:13px;max-width:420px;margin:14px auto 0;line-height:1.8}.head .hl{width:50px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px auto 0}
.bar{position:sticky;top:var(--nav);z-index:40;background:rgba(246,239,231,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--cream2);padding:12px 0}
.pills{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:40px;padding:0 20px;border-radius:4px;border:1px solid var(--cream2);background:var(--white);font:600 11px var(--sans);letter-spacing:2px;text-transform:uppercase;white-space:nowrap;color:var(--gray);transition:.2s}
.pill:hover{border-color:var(--gold);color:var(--black)}.pill.on{background:var(--black);color:var(--gold);border-color:var(--black)}
.pill.sm{min-height:34px;padding:0 14px;font-size:10px;letter-spacing:1.5px;font-weight:500}.pill.sm.on{background:var(--gold);color:var(--black);border-color:var(--gold)}
.tools{display:flex;gap:10px;align-items:center;margin-top:10px}.tools .pills{flex:1}.tools select{flex:none;height:36px;border:1px solid var(--cream2);border-radius:4px;background:var(--white);padding:0 10px;font:400 12px var(--sans);max-width:46%;color:var(--black)}
.csec{padding:clamp(34px,6vw,56px) 0 6px}.chd{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--cream2)}
.chd h2{font:300 clamp(32px,5vw,46px)/1.1 var(--serif);letter-spacing:.5px}.chd.t h2{color:var(--crimson);font-style:italic}.chd p{color:var(--gray);font-size:13px;line-height:1.8;max-width:520px;margin-top:6px}.chd .n{font-size:10px;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase;font-weight:600}
.empty{text-align:center;padding:60px 16px;color:var(--gray)}
/* MODAL */
.back{position:fixed;inset:0;z-index:300;background:rgba(10,10,10,.7);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}.back.on{display:flex}

.sheet .cl{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:600}.sheet h2{font:400 clamp(28px,5vw,34px)/1.1 var(--serif)}
.sheet p{font-size:13px;line-height:1.75;color:var(--gray)}.sheet .pr b{font-size:28px}.sheet .btn{width:100%;margin-top:6px;border-radius:8px}
.sheet .btn.fill{background:var(--black);color:var(--gold)}.sheet .btn.fill:hover{background:var(--gold);color:var(--black)}
.x{position:absolute;top:12px;right:12px;z-index:3;width:32px;height:32px;border-radius:50%;border:0;background:rgba(10,10,10,.55);color:#fff;font-size:15px;transition:.2s}.x:hover{background:var(--crimson)}
@media(min-width:760px){.back{align-items:center;padding:24px}.sheet{display:grid;grid-template-columns:44% 1fr;max-width:720px;border-radius:14px;max-height:88svh}.sheet .im{aspect-ratio:auto;min-height:100%}}

.pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;max-width:900px;margin:clamp(34px,5vw,52px) auto 0;position:relative}

.paso{display:flex;flex-direction:column;align-items:center;gap:12px}.paso i{width:56px;height:56px;border-radius:50%;border:1px solid rgba(201,168,76,.3);display:grid;place-items:center;background:#0f0e0b;position:relative;z-index:1;font-style:normal;font-size:20px;color:var(--gold)}
.paso h3{font:600 12px var(--sans);color:var(--white);letter-spacing:1px;text-transform:uppercase}.paso p{font-size:12px;color:rgba(255,255,255,.4);line-height:1.6;max-width:200px}
@media(max-width:700px){.pasos{grid-template-columns:1fr;gap:28px}.pasos:before{display:none}}
.contact{background:var(--black);text-align:center;position:relative;overflow:hidden}.contact:before{content:'';position:absolute;top:0;left:50%;width:1px;height:60px;background:linear-gradient(var(--gold),transparent)}
.contact .title{color:var(--white)}.contact .rule{margin-left:auto;margin-right:auto}.contact p{font-size:13px;color:rgba(255,255,255,.45);max-width:420px;margin:18px auto 38px;line-height:1.8}
.btn.wab{background:#25D366;color:#fff;border-radius:8px;letter-spacing:1.5px;font-weight:600;padding:14px 28px}.btn.wab:hover{transform:translateY(-3px)}
.flogo{font:italic 300 clamp(36px,10vw,56px) var(--serif);color:rgba(255,255,255,.08);letter-spacing:8px;margin-top:46px;user-select:none;text-transform:uppercase}.flogo span{color:rgba(201,168,76,.18)}

.bt{position:fixed;right:28px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:90;width:38px;height:38px;border-radius:50%;background:rgba(10,10,10,.7);border:1px solid rgba(201,168,76,.3);color:var(--gold);font-size:14px;display:grid;place-items:center;opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(6px)}.bt.on{opacity:1;pointer-events:auto}.bt:hover{background:var(--gold);color:var(--black)}

@media(pointer:fine){.cur-d,.cur-r{display:block}body,a,button{cursor:none}.cur-d{width:8px;height:8px;background:var(--gold);transition:transform .08s}.cur-r{width:30px;height:30px;border:1.5px solid rgba(201,168,76,.55);transition:left .12s,top .12s,width .2s,height .2s,background .2s}.cur-d.big{transform:translate(-50%,-50%) scale(2.5)}.cur-r.big{width:48px;height:48px;background:rgba(201,168,76,.07);border-color:var(--gold)}}

</style>
<style>

    todo.reduce(function(p,l){return p.then(function(){return tr1(nv.es,l).then(function(t){if(t)nv[l]=t}).catch(function(){})})},Promise.resolve()).then(function(){
      DB.textos[k]=nv;return commit('Texto: '+k)}).then(function(){shut();home();msg('✓ Guardado. Se ve en la página en 1 o 2 minutos.')}).catch(function(e){busy('sv',1);msg(e.message,1)})}}
function ajustes(){sheet('<h2>Ajustes</h2><p class="mut">Número de WhatsApp para recibir pedidos (con código de país, sin + ni espacios). Ej: 573001234567</p><label class="fld">WhatsApp<input id="wn" inputmode="numeric" value="'+esc(DB.config.whatsapp||'')+'"></label><button class="btn fill blk" id="sv">Guardar</button><button class="btn line blk" id="cl">Cancelar</button>');
  $('cl').onclick=shut;$('sv').onclick=function(){DB.config.whatsapp=$('wn').value.replace(/\D/g,'');busy('sv');commit('Ajustes de WhatsApp').then(function(){shut();msg('<span class="ok" style="color:#9be0a6">✓ Guardado</span>')}).catch(function(e){busy('sv',1);msg(e.message,1)})}}
function sheet(h){$('sh').innerHTML='<div class="in">'+h+'</div>';$('bk').classList.add('on');document.body.style.overflow='hidden'}
function shut(){$('bk').classList.remove('on');document.body.style.overflow='';ED=null}
$('bk').onclick=function(e){if(e.target===$('bk'))shut()};
function busy(id,off){var b=$(id);if(!b)return;b.disabled=!off;b.style.opacity=off?1:.6;if(!off){b.dataset.t=b.textContent;b.textContent='Guardando…'}else b.textContent=b.dataset.t||b.textContent}
function form(id,draft){
  var p=draft?JSON.parse(JSON.stringify(draft.p)):id?JSON.parse(JSON.stringify(findP(id))):{id:idMax()+1,nombre:'',col:'tierradentro',cat:'Aretes',precio:0,precioOld:null,img:'',badge:null,estrellas:5,stock:5,desc:'',i18n:{}};
  ED={p:p,img:null,draft:draft||null,bor:!!(id&&inBor(id))};var T=p.i18n||{};
  var opt=function(a,v){return a.map(function(x){return'<option value="'+esc(x[0])+'"'+(x[0]===v?' selected':'')+'>'+esc(x[1])+'</option>'}).join('')};
  sheet('<h2>'+(ED.bor?'Configurar producto':id?'Editar producto':'Nuevo producto')+'</h2>'
  +'<label class="fld">Foto</label><div class="ph"><img id="pv" src="'+esc(TH[p.img]||p.img||'')+'" alt=""><div><button class="btn line s" id="pb" type="button">Elegir foto</button><input type="file" id="pf" accept="image/*" hidden><p class="mut" style="margin-top:8px;font-size:13px">Puedes tomarla con la cámara o elegirla de la galería.</p></div></div>'
  +'<label class="fld">Nombre (español)<input id="n" value="'+esc(p.nombre)+'"></label>'
  +'<label class="fld">Descripción (español)<textarea id="d">'+esc(p.desc)+'</textarea></label>'
  +'<div class="r2"><label class="fld">Colección<select id="c">'+opt([['tierradentro','Tierradentro'],['contemporanea','Línea Contemporánea']],p.col)+'</select></label><label class="fld">Categoría<select id="k">'+opt(CATS.map(function(c){return[c,c]}),p.cat)+'</select></label></div>'
  +'<div class="r2"><label class="fld">Precio<input id="pr" type="number" inputmode="numeric" value="'+p.precio+'"></label><label class="fld">Precio anterior<input id="po" type="number" inputmode="numeric" value="'+(p.precioOld||'')+'"></label></div>'
  +'<div class="r2"><label class="fld">Unidades disponibles<input id="st" type="number" inputmode="numeric" value="'+p.stock+'"></label><label class="fld">Etiqueta<select id="bd">'+opt([['','Ninguna'],['nuevo','Nuevo'],['oferta','Oferta'],['popular','Popular']],p.badge||'')+'</select></label></div>'
  +'<details open><summary>Traducciones</summary><button class="btn line s" id="tr" type="button" style="margin:12px 0 0">✦ Traducir automáticamente</button><p class="mut" style="font-size:13px;margin-top:8px">Traduce el nombre y la descripción a los 4 idiomas. Puedes corregirlos a mano.</p>'
  +LG.map(function(l){var x=T[l]||{};return'<label class="fld">'+LN[l]+' · nombre<input id="n_'+l+'" value="'+esc(x.nombre||'')+'"></label><label class="fld">'+LN[l]+' · descripción<textarea id="d_'+l+'">'+esc(x.desc||'')+'</textarea></label>'}).join('')+'</details>'
  +'<button class="btn fill blk" id="sv">'+(ED.bor?'Guardar y publicar':'Guardar')+'</button>'+((id||draft)?'<button class="btn red blk" id="rm">'+(draft?'Descartar esta foto':'Eliminar producto')+'</button>':'')+'<button class="btn line blk" id="cl">Cancelar</button>');
  $('cl').onclick=shut;$('pb').onclick=function(){$('pf').click()};$('pf').onchange=function(e){photo(e.target.files[0])};$('tr').onclick=translate;$('sv').onclick=save;if(draft){$('rm').onclick=function(){if(!confirm('¿Descartar esta foto?'))return;dbDel(draft.id).catch(function(){});DR=DR.filter(function(d){return d.id!==draft.id});shut();home()}}else if(id)$('rm').onclick=remove}
function photo(f){if(!f)return;var im=new Image();im.onload=function(){var m=1200,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  var u=c.toDataURL('image/jpeg',.85);ED.img={name:'prod-'+ED.p.id+'-'+Date.now().toString(36)+'.jpg',b64:u.split(',')[1]};$('pv').src=u};im.src=URL.createObjectURL(f)}
function tr1(q,l){return fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair=es|'+l).then(function(r){return r.json()}).then(function(j){var t=document.createElement('textarea');t.innerHTML=(j.responseData&&j.responseData.translatedText)||'';return t.value})}
function translate(){var n=$('n').value.trim(),d=$('d').value.trim();if(!n)return msg('Escribe primero el nombre en español',1);var b=$('tr');b.disabled=true;b.textContent='Traduciendo…';
  LG.reduce(function(pr,l){return pr.then(function(){return Promise.all([tr1(n,l),d?tr1(d,l):''])}).then(function(r){$('n_'+l).value=r[0];$('d_'+l).value=r[1]})},Promise.resolve()).then(function(){b.textContent='✦ Traducir automáticamente';b.disabled=false;msg('Traducido. Revisa los textos y guarda.')}).catch(function(){b.textContent='✦ Traducir automáticamente';b.disabled=false;msg('No se pudo traducir ahora. Escríbelas a mano.',1)})}
function save(){var p=ED.p;p.nombre=$('n').value.trim();if(!p.nombre)return msg('Falta el nombre',1);
  p.desc=$('d').value.trim();p.col=$('c').value;p.cat=$('k').value;p.precio=+$('pr').value||0;p.precioOld=+$('po').value||null;p.stock=+$('st').value||0;p.badge=$('bd').value||null;
  p.i18n={};LG.forEach(function(l){var n=$('n_'+l).value.trim(),d=$('d_'+l).value.trim();if(n||d)p.i18n[l]={nombre:n||p.nombre,desc:d||p.desc}});
  if(ED.draft){if(!(p.precio>0))return msg('Falta el precio',1);var dr=ED.draft;dr.p=p;dr.ready=true;if(ED.img)dr.u='data:image/jpeg;base64,'+ED.img.b64;dbPut(dr).catch(function(){});shut();home();return msg('✓ Listo. Cuando termines con todos, toca Publicar.')}
  if(ED.bor){if(!(p.precio>0))return msg('Falta el precio',1);DB.borradores=DB.borradores.filter(function(x){return x.id!==p.id})}
  if(ED.img)p.img=ED.img.name;var i=DB.productos.map(function(x){return x.id}).indexOf(p.id);if(i<0)DB.productos.push(p);else DB.productos[i]=p;
  busy('sv');commit((i<0?'Nuevo producto: ':'Editar: ')+p.nombre,ED.img).then(function(){shut();home();msg('✓ Guardado. La página se actualiza sola en 1 o 2 minutos.')}).catch(function(e){busy('sv',1);msg(e.message,1);return load().then(function(){}).catch(function(){})})}
function remove(){var p=ED.p;if(!confirm('¿Eliminar "'+p.nombre+'"?'))return;DB.productos=DB.productos.filter(function(x){return x.id!==p.id});DB.borradores=DB.borradores.filter(function(x){return x.id!==p.id});busy('rm');
  commit('Eliminar: '+p.nombre).then(function(){shut();home();msg('✓ Eliminado')}).catch(function(e){msg(e.message,1);load().then(home)})}
try{dbAll().then(function(d){(d||[]).forEach(function(r){if(r.id.indexOf('t-')===0)TH[r.id.slice(2)]=r.u});if(DB&&!$('bk').classList.contains('on'))home()}).catch(function(){})}catch(e){}
if(S.token&&S.owner&&S.repo){$('app').innerHTML='<p class="mut" style="padding:40px 0;text-align:center">Cargando…</p>';load().then(home).catch(function(e){login();msg(e.message,1)})}else login();
})();
</script></body></html>
